# boring-wm — brutalist Hyprland config
# Zero animations, zero chrome, pure black desktop.

$mod = SUPER

# ── Sourced overrides (theme, style, monitors, workspaces) ──────────
source = ~/.config/hypr/theme.conf
source = ~/.config/hypr/style.conf
source = ~/.config/hypr/workspace-rules.conf
source = ~/.config/hypr/monitors.conf

# ── Monitors (defaults; monitors.conf from nwg-displays wins) ───────
monitor = eDP-1, preferred, 0x0, 1.333333, cm, auto, sdrsaturation, 1.2
monitor = HDMI-A-1, preferred, 1440x0, 1
monitor = , preferred, auto, 1

# ── Environment ─────────────────────────────────────────────────────
env = XCURSOR_THEME,macOS
env = XCURSOR_SIZE,24

# ── General ─────────────────────────────────────────────────────────
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    layout = dwindle
}

# ── Decoration (overridden by style.conf, kept for reload safety) ─────
decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = false
        size = 0
        passes = 0
    }
    shadow {
        enabled = false
        range = 0
    }
}

# ── Animations off ──────────────────────────────────────────────────
animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    bezier = easeOut, 0, 0, 0.58, 1.0
    animation = windows, 0
    animation = windowsOut, 0
    animation = fade, 0
    animation = workspaces, 0
    animation = layers, 0
}

# ── Input ───────────────────────────────────────────────────────────
input {
    follow_mouse = 1
    sensitivity = 0
    natural_scroll = true
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        scroll_factor = 0.7
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

cursor {
    inactive_timeout = 5
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# ── hyprview overview (optional plugin) ─────────────────────────────
plugin {
    hyprview {
        margin = 16
        border_width = 3
        border_radius = 0
        bg_dim = 0.5
        active_border_color = rgba(94e2d5ff)
        inactive_border_color = rgba(333333cc)
        gesture_distance = 300
        window_name_enabled = 1
        workspace_indicator_enabled = 0
        window_name_font_size = 18
    }
}

# ── Keybinds ────────────────────────────────────────────────────────
bind = , F4, hyprview:toggle, all
bind = , XF86AudioMicMute, hyprview:toggle, all

bind = $mod, Return, exec, ghostty
bind = $mod, Space, exec, rofi -show drun -auto-select
bind = $mod ALT, Space, exec, $HOME/bin/power-menu
bind = $mod SHIFT, Space, exec, $HOME/bin/battery-menu
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exit,
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1
bind = $mod, bracketleft, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, X, togglesplit,
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic
bind = $mod, C, exec, wtype -M ctrl -P c -p c -m ctrl
bind = $mod, V, exec, wtype -M ctrl -P v -p v -m ctrl
bind = $mod, B, exec, brave-origin-beta
bind = $mod, Z, exec, zeditor
bind = $mod, O, exec, obsidian
bind = $mod, W, exec, $HOME/.local/bin/wallpaper
bind = $mod SHIFT, W, exec, $HOME/bin/wallpaper-browser
bind = $mod, M, exec, $HOME/bin/system-menu
bind = $mod, D, exec, nwg-displays
bind = $mod SHIFT, R, exec, $HOME/bin/rotate-screen
bind = $mod, bracketright, exec, $HOME/bin/clipboard-menu
bind = $mod SHIFT, Return, exec, alacritty

# Focus
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Swap
bind = $mod SHIFT, H, swapwindow, l
bind = $mod SHIFT, L, swapwindow, r
bind = $mod SHIFT, K, swapwindow, u
bind = $mod SHIFT, J, swapwindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = CTRL SHIFT, 4, exec, ~/.local/bin/screenshot
bind = CTRL ALT, Q, exec, pidof hyprlock || hyprlock
bind = CTRL ALT SHIFT, P, exec, systemctl poweroff -i

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

binde = $mod ALT, H, resizeactive, -30 0
binde = $mod ALT, L, resizeactive, 30 0
binde = $mod ALT, K, resizeactive, 0 -30
binde = $mod ALT, J, resizeactive, 0 30

bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Autostart ───────────────────────────────────────────────────────
exec-once = swayosd-server
exec-once = mako
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = nm-applet --indicator
exec-once = waybar -c ~/.config/waybar/config -s ~/.config/waybar/style.css
exec-once = hyprctl keyword misc:background_color rgb(000000)

# ── Layer rules ─────────────────────────────────────────────────────
layerrule = noanim, rofi

# ── Window rules ────────────────────────────────────────────────────
windowrule = noblur, match:class ^(brave|brave-origin-beta|brave-origin-nightly|brave-browser)$
windowrule = noblur, match:class ^com\.mitchellh\.ghostty$
windowrule = float on, match:class bluetooth-tui
windowrule = size 600 400, match:class bluetooth-tui
windowrule = center on, match:class bluetooth-tui
windowrule = float on, match:class .pavucontrol-wrapped
windowrule = size 800 500, match:class .pavucontrol-wrapped
windowrule = center on, match:class .pavucontrol-wrapped

# ── Misc ────────────────────────────────────────────────────────────
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    new_window_takes_over_fullscreen = 2
    enable_swallow = false
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

xwayland {
    force_zero_scaling = true
}

debug {
    suppress_errors = true
}