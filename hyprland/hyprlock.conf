# Managed by scripts/theme-switch — edits here are overwritten.
# Theme: boring — TTY/getty-style console login.
general {
    hide_cursor = true
    grace = 0
    no_fade_in = true
    no_fade_out = true
    ignore_empty_input = true
    text_trim = true
}

# Fingerprint via fprintd D-Bus, in parallel with PAM password auth
# (same wiring as the other themes — see configuration.nix).
auth {
    fingerprint {
        enabled = true
        ready_message =
        present_message = authenticating…
        retry_delay = 250
    }
}

# Solid pure-black console — no image, no blur.
background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
}

# ─── Clock — top-right, dim, ticking ─────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%a %b %-d  %H:%M:%S"
    color = rgba(888888ff)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = -14, -12
    halign = right
    valign = top
}

# ─── getty banner — top-left ─────────────────────────────────────────
label {
    monitor =
    text = cmd[update:0] . /etc/os-release 2>/dev/null; printf '<<< Welcome to %s - tty1 (%s) >>>' "${PRETTY_NAME:-NixOS}" "$(uname -m)"
    color = rgba(ccccccff)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 14, -12
    halign = left
    valign = top
}

# ─── Login line — username prefilled ─────────────────────────────────
label {
    monitor =
    text = gradient login: gradient
    color = rgba(ffffffff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 14, -44
    halign = left
    valign = top
}

# ─── Password prompt label ───────────────────────────────────────────
label {
    monitor =
    text = Password:
    color = rgba(ffffffff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 14, -62
    halign = left
    valign = top
}

# ─── Password input — flat, transparent, no echo (TTY-style) ─────────
# Sits inline after "Password:". Nudge `position` x if the prompt/field
# spacing looks off on your display.
input-field {
    monitor =
    size = 300, 16
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = false
    dots_rounding = -1
    rounding = 0
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)
    font_color = rgba(ffffffff)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    fade_timeout = 0
    hide_input = true
    placeholder_text =
    check_color = rgba(ffffffff)
    fail_color = rgba(ffffffff)
    fail_text = login incorrect ($ATTEMPTS)
    capslock_color = rgba(ffffffff)
    position = 90, -62
    halign = left
    valign = top
}

# ─── Fingerprint hint — dim, below the prompt ────────────────────────
label {
    monitor =
    text = (touch the fingerprint reader or type your password)
    color = rgba(666666ff)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 14, -88
    halign = left
    valign = top
}
